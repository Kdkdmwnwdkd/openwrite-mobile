name: Build Android APK

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools build-tools;34.0.0 platforms;android-34'

      - name: Install Capacitor CLI
        run: npm install -g @capacitor/cli

      - name: Syntax check
        run: |
          for f in frontend/js/*.js; do
            echo "checking $f"
            node --check "$f"
          done

      - name: Install dependencies
        run: npm ci

      - name: Add Android platform
        run: |
          rm -rf android
          npx cap add android

      - name: Set version from package.json
        run: |
          VERSION=$(node -p "require('./package.json').version")
          VCODE=$(date +%Y%m%d)
          echo "Setting versionName=$VERSION versionCode=$VCODE"
          sed -i "s/versionCode [0-9]*/versionCode $VCODE/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"$VERSION\"/" android/app/build.gradle
          grep -nE "versionCode|versionName" android/app/build.gradle

      - name: Sync Capacitor
        run: npx cap sync

      - name: Configure signing
        run: |
          # Capacitor 6 生成的 build.gradle 里没有 signingConfigs，
          # debug 构建走的是 AGP 在 runner 上**随机生成**的 ~/.android/debug.keystore。
          # 也就是说每次 CI 出来的包签名都不一样，用户覆盖安装必然报「签名不一致」。
          # 这里显式注入固定签名。
          cp keystore/debug.keystore android/app/fixed.keystore
          python3 - <<'PYEOF'
          p = 'android/app/build.gradle'
          s = open(p).read()

          if 'signingConfigs' not in s:
              s = s.replace('android {', '''android {
              signingConfigs {
                  fixed {
                      storeFile file('fixed.keystore')
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                  }
              }
          ''', 1)

          if 'signingConfig signingConfigs.fixed' not in s:
              s = s.replace('buildTypes {', '''buildTypes {
                  debug {
                      signingConfig signingConfigs.fixed
                  }
              ''', 1)

          open(p, 'w').write(s)
          print('signingConfigs injected:', 'fixed.keystore' in s)
          PYEOF

          echo "--- signingConfigs ---"
          sed -n '/signingConfigs/,/^    }/p' android/app/build.gradle || true
          echo "--- buildTypes ---"
          sed -n '/buildTypes {/,/^    }/p' android/app/build.gradle || true

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew clean
          ./gradlew assembleDebug

      # 签名一旦漂移，用户装机就会报「签名不一致」，而报错发生在手机上，排查很麻烦。
      # 这里把证书指纹打进日志，一眼能对上。
      - name: Verify signing certificate
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          if [ -x "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs "$APK" | head -6
          else
            echo "apksigner 不存在，跳过校验"
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: openwrite-mobile-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: Delete old release asset
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Get release ID for nightly-debug tag
          RELEASE_ID=$(curl -s -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/nightly-debug" | \
            jq -r '.id')
          if [ "$RELEASE_ID" != "null" ] && [ -n "$RELEASE_ID" ]; then
            # Get asset ID for app-debug.apk
            ASSET_ID=$(curl -s -H "Authorization: Bearer $GITHUB_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/releases/$RELEASE_ID/assets" | \
              jq -r '.[] | select(.name=="app-debug.apk") | .id')
            if [ -n "$ASSET_ID" ] && [ "$ASSET_ID" != "null" ]; then
              echo "Deleting old asset $ASSET_ID"
              curl -s -X DELETE -H "Authorization: Bearer $GITHUB_TOKEN" \
                "https://api.github.com/repos/${{ github.repository }}/releases/assets/$ASSET_ID"
            fi
          fi

      - name: Create Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
          tag_name: nightly-debug
          name: OpenWrite Mobile Nightly Debug
          body: |
            Latest debug build from GitHub Actions
            - Commit: ${{ github.sha }}
            - Branch: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # GitHub release 在国内直连只有十几 KB/s，手机上下个 4MB 的包要等好几分钟。
      # 这里把同一个 APK 同步到 dist 分支，走 jsDelivr 的国内 CDN 下载。
      # 固定文件名 + 强制单提交，分支不会越拉越大。
      - name: Publish to dist branch (CDN mirror)
        if: success() && github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          VERSION=$(node -p "require('./package.json').version")
          SIZE=$(stat -c%s "$APK")
          SHA=$(sha256sum "$APK" | awk '{print $1}')

          rm -rf /tmp/distrepo && mkdir -p /tmp/distrepo/apk
          cd /tmp/distrepo
          # 只放带版本号的文件名。
          # 实测 jsDelivr 对同一路径（apk/app-debug.apk）有源站级长缓存，
          # purge 清不掉，发版后仍会返回上一版——那比慢更糟，会让人装到旧包。
          # 带版本号的路径每次不同，必定回源，立即拿到新包。
          cp "$GITHUB_WORKSPACE/$APK" "apk/app-${VERSION}.apk"
          {
            echo "OpenWrite Android 安装包（自动同步，勿手改）"
            echo
            echo "版本：v${VERSION}"
            echo "构建：${{ github.sha }}"
            echo "大小：${SIZE} 字节"
            echo "SHA-256：${SHA}"
            echo
            echo "下载：https://testingcf.jsdelivr.net/gh/${{ github.repository }}@dist/apk/app-${VERSION}.apk"
          } > apk/README.md

          git init -q
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add -f "apk/app-${VERSION}.apk" apk/README.md
          git commit -q -m "dist: v${VERSION} ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" HEAD:dist

          echo "purging CDN cache..."
          curl -s "https://purge.jsdelivr.net/gh/${{ github.repository }}@dist/apk/app-${VERSION}.apk" | head -c 200 || true
