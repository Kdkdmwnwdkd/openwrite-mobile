name: Build Android APK

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools build-tools;34.0.0 platforms;android-34'

      - name: Install Capacitor CLI
        run: npm install -g @capacitor/cli

      - name: Syntax check
        run: |
          for f in frontend/js/*.js; do
            echo "checking $f"
            node --check "$f"
          done

      - name: Install dependencies
        run: npm ci

      - name: Add Android platform
        run: |
          rm -rf android
          npx cap add android

      - name: Set version from package.json
        run: |
          VERSION=$(node -p "require('./package.json').version")
          VCODE=$(date +%Y%m%d)
          echo "Setting versionName=$VERSION versionCode=$VCODE"
          sed -i "s/versionCode [0-9]*/versionCode $VCODE/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"$VERSION\"/" android/app/build.gradle
          grep -nE "versionCode|versionName" android/app/build.gradle

      - name: Sync Capacitor
        run: npx cap sync

      - name: Configure signing
        run: |
          # 复制固定签名到 android/app/
          cp keystore/debug.keystore android/app/debug.keystore
          # 修改 build.gradle 使用固定签名
          sed -i '/debug {/,/}/s/storeFile.*/storeFile file('\''debug.keystore'\'')/' android/app/build.gradle
          grep -A4 "signingConfigs" android/app/build.gradle || true

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew clean
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: openwrite-mobile-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: Delete old release asset
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Get release ID for nightly-debug tag
          RELEASE_ID=$(curl -s -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/nightly-debug" | \
            jq -r '.id')
          if [ "$RELEASE_ID" != "null" ] && [ -n "$RELEASE_ID" ]; then
            # Get asset ID for app-debug.apk
            ASSET_ID=$(curl -s -H "Authorization: Bearer $GITHUB_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/releases/$RELEASE_ID/assets" | \
              jq -r '.[] | select(.name=="app-debug.apk") | .id')
            if [ -n "$ASSET_ID" ] && [ "$ASSET_ID" != "null" ]; then
              echo "Deleting old asset $ASSET_ID"
              curl -s -X DELETE -H "Authorization: Bearer $GITHUB_TOKEN" \
                "https://api.github.com/repos/${{ github.repository }}/releases/assets/$ASSET_ID"
            fi
          fi

      - name: Create Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
          tag_name: nightly-debug
          name: OpenWrite Mobile Nightly Debug
          body: |
            Latest debug build from GitHub Actions
            - Commit: ${{ github.sha }}
            - Branch: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # GitHub release 在国内直连只有十几 KB/s，手机上下个 4MB 的包要等好几分钟。
      # 这里把同一个 APK 同步到 dist 分支，走 jsDelivr 的国内 CDN 下载。
      # 固定文件名 + 强制单提交，分支不会越拉越大。
      - name: Publish to dist branch (CDN mirror)
        if: success() && github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          VERSION=$(node -p "require('./package.json').version")
          SIZE=$(stat -c%s "$APK")
          SHA=$(sha256sum "$APK" | awk '{print $1}')

          rm -rf /tmp/distrepo && mkdir -p /tmp/distrepo/apk
          cd /tmp/distrepo
          # 同时放两份：
          #   app-debug.apk   固定名，方便分享，但 jsDelivr 对同名路径有长缓存，会滞后
          #   app-<版本>.apk  路径每次不同，必定回源，发版后立即生效
          cp "$GITHUB_WORKSPACE/$APK" "apk/app-${VERSION}.apk"
          cp "$GITHUB_WORKSPACE/$APK" apk/app-debug.apk
          {
            echo "OpenWrite Android 安装包（自动同步，勿手改）"
            echo
            echo "版本：v${VERSION}"
            echo "构建：${{ github.sha }}"
            echo "大小：${SIZE} 字节"
            echo "SHA-256：${SHA}"
            echo
            echo "下载：https://testingcf.jsdelivr.net/gh/${{ github.repository }}@dist/apk/app-${VERSION}.apk"
          } > apk/README.md

          git init -q
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add -f "apk/app-${VERSION}.apk" apk/app-debug.apk apk/README.md
          git commit -q -m "dist: v${VERSION} ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" HEAD:dist

          # 带版本的新路径本身不会命中旧缓存，但仍清一次固定名，让它尽快跟上
          echo "purging CDN cache..."
          for f in "apk/app-debug.apk" "apk/app-${VERSION}.apk" "apk/README.md"; do
            curl -s "https://purge.jsdelivr.net/gh/${{ github.repository }}@dist/$f" | head -c 200 || true
            echo
          done
