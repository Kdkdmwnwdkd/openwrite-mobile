<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#6366f1">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>OpenWrite - AI小说写作助手</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="images/icon-192.png">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app">
        <!-- Header -->
        <header class="app-header" id="header">
            <div class="header-title" id="page-title">书架</div>
            <div class="header-actions" id="header-actions"></div>
        </header>

        <!-- Main Content -->
        <main class="main-content" id="main-content">
            <!-- Views will be injected here -->
        </main>

        <!-- Bottom Navigation -->
        <nav class="bottom-nav" id="bottom-nav">
            <a href="#" class="nav-item active" data-page="chat" onclick="navigateTo('chat')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                </svg>
                <span>对话</span>
            </a>
            <a href="#" class="nav-item" data-page="bookshelf" onclick="navigateTo('bookshelf')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
                    <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
                </svg>
                <span>小说</span>
            </a>
            <a href="#" class="nav-item" data-page="settings" onclick="navigateTo('settings')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="3"/>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l-.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                </svg>
                <span>设置</span>
            </a>
        </nav>
    </div>

    <!-- 左侧抽屉 - 对话历史 -->
    <div class="drawer-overlay" id="drawer-overlay" onclick="closeChatDrawer()"></div>
    <div class="chat-drawer" id="chat-drawer">
        <div class="drawer-header">
            <button class="drawer-new-btn" onclick="startNewChatSession()">+ 新对话</button>
            <button class="drawer-batch-btn" onclick="toggleBatchDelete()">批量删除</button>
        </div>
        <div class="drawer-list" id="drawer-list">
            <!-- 会话列表由 JS 渲染 -->
        </div>
    </div>

    <script src="js/app.js"></script>
    <script src="js/skills.js"></script>
    <script src="js/distill.js"></script>
    <script src="js/export.js"></script>
</body>
</html>
